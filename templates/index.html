<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Stock Prediction</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card p-4">
        <h2 class="text-center mb-4 text-primary">📈 AI Stock Prediction Tool</h2>

        <form method="POST">
          <div class="mb-3">
            <label for="symbol" class="form-label">Stock Symbol</label>
            <input type="text" id="symbol" name="symbol" class="form-control" placeholder="e.g. THYAO.IS" required>
          </div>
          <div class="mb-3">
            <label for="start_date" class="form-label">Start Date</label>
            <input type="date" name="start_date" id="start_date" class="form-control">
          </div>
          <div class="mb-3">
            <label for="end_date" class="form-label">End Date</label>
            <input type="date" name="end_date" id="end_date" class="form-control">
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-custom">🔮 Predict</button>
          </div>
        </form>

        {% if predicted_value %}
        <div class="mt-4">
          <h5 class="text-success">Predicted Price:</h5>
          <p class="fs-4">₺ {{ predicted_value }}</p>
        </div>
        {% endif %}

        {% if plot_json %}
        <div class="mt-4">
          <h5 class="text-secondary">Prediction Chart:</h5>
          <div id="predictionChart" class="chart-area"></div>

          <script type="application/json" id="plot-data">
            {{ plot_json | safe }}
          </script>
          <script>
            document.addEventListener("DOMContentLoaded", function () {
              const raw = document.getElementById("plot-data").textContent;
              const data = JSON.parse(raw);
              Plotly.newPlot("predictionChart", data.data, data.layout);
            });
          </script>
        </div>
        {% endif %}
      </div>

      <p class="text-center text-muted mt-4 small">
        Developed by <strong>Merve Sena Çınar</strong> • 2025 Graduation Project
      </p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
